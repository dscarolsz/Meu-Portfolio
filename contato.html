<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana Carolina - Meu Portfólio</title>
    <link rel="stylesheet" href="styles.css/style.css"/>
    <link rel="icon" type="image/x-icon" href="./img/emblema.do.infinito.jpg"/>
</head>
<body>

    <div class="pagina">
        
        <header class="cabecalho">
            <nav>
                <ul class="menu-navegacao">
                    <li><a href="index.html">Sobre mim</a></li>
                    <li><a href="projeto.html">Projetos</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </header>

        <div class="conteudo">
            <main>
                <h1>ENTRE EM CONTATO 👩🏻‍💻</h1>
                <p>Envie uma mensagem abaixo ou fale comigo pelas redes sociais!</p>

                <form action="agradecimento.html" method="GET" class="formulario-contato">
                    <div>
                        <label for="nome">Nome:</label><br>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <br>
                    <div>
                        <label for="email">E-mail:</label><br>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <br>
                    <div>
                        <label for="mensagem">Mensagem:</label><br>
                        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                    </div>
                    <br>
                    <button type="submit">Enviar Mensagem</button>
                </form>
            </main>
        </div>

    </div>

</body>
</html>
